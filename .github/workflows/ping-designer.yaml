name: Notify Designer on PR Merge

on:
  pull_request:
    types: [closed]
    branches:
      - staging

jobs:
  notify-designer:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get linked issue
        id: get-issue
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          # Extract issue number from PR body (assumes format like "Closes #123" or "Fixes #123")
          ISSUE_NUMBER=$(echo "$PR_BODY" | grep -oE "(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#[0-9]+" | grep -oE "#[0-9]+" | sed 's/#//')
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "No linked issue found in PR description"
            echo "issue_number=" >> $GITHUB_OUTPUT
          else
            echo "Linked issue: #$ISSUE_NUMBER"
            echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          fi

      - name: Check if issue has UI label and designer
        if: steps.get-issue.outputs.issue_number != ''
        id: check-issue
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = ${{ steps.get-issue.outputs.issue_number }};
            const { owner, repo } = context.repo;
            
            try {
              // Get issue data
              const issue = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber
              });
              
              // Check for UI label
              const hasUILabel = issue.data.labels.some(label => 
                label.name.toLowerCase().includes('ui') || 
                label.name.toLowerCase().includes('design')
              );
              
              if (!hasUILabel) {
                console.log("Issue does not have a UI label");
                return {
                  hasUILabel: false
                };
              }
              
              // Look for Designer Attached field in the issue body
              const issueBody = issue.data.body || "";
              const designerMatch = issueBody.match(/Designer Attached:?\s*@([a-zA-Z0-9-]+)/);
              const designerUsername = designerMatch ? designerMatch[1] : null;
              
              // If we have both a UI label and a designer, proceed
              return {
                hasUILabel: true,
                designerUsername: designerUsername
              };
            } catch (error) {
              console.log(`Error getting issue: ${error}`);
              return {
                hasUILabel: false
              };
            }

      - name: Find designer's Slack ID
        if: fromJSON(steps.check-issue.outputs.result).hasUILabel && fromJSON(steps.check-issue.outputs.result).designerUsername
        id: find-slack-id
        run: |
          DESIGNER_USERNAME="${{ fromJSON(steps.check-issue.outputs.result).designerUsername }}"
          echo "Looking for Slack ID for GitHub user: @$DESIGNER_USERNAME"
          
          # Read from designer_map.txt and find the matching Slack ID
          if [ -f "designer_map.txt" ]; then
            SLACK_ID=$(grep -E "^@$DESIGNER_USERNAME [A-Z0-9]+" designer_map.txt | awk '{print $2}')
            if [ -n "$SLACK_ID" ]; then
              echo "Found Slack ID: $SLACK_ID"
              echo "slack_id=$SLACK_ID" >> $GITHUB_OUTPUT
            else
              echo "No Slack ID found for @$DESIGNER_USERNAME"
              echo "slack_id=" >> $GITHUB_OUTPUT
            fi
          else
            echo "designer_map.txt file not found"
            echo "slack_id=" >> $GITHUB_OUTPUT
          fi

      - name: Prepare message
        id: prepare-message
        if: fromJSON(steps.check-issue.outputs.result).hasUILabel
        run: |
          if [ -n "${{ steps.find-slack-id.outputs.slack_id }}" ] && [ "${{ fromJSON(steps.check-issue.outputs.result).designerUsername }}" != "null" ]; then
            echo "message=👋 <@${{ steps.find-slack-id.outputs.slack_id }}> This PR includes UI changes that need your review!" >> $GITHUB_OUTPUT
          else
            echo "message=This PR includes UI changes." >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.24.0
        if: fromJSON(steps.check-issue.outputs.result).hasUILabel
        with:
          payload: |
            {
              "text": "✅ PR #${{ github.event.pull_request.number }} has been merged into staging: ${{ github.event.pull_request.title }}\n${{ github.event.pull_request.html_url }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ PR #${{ github.event.pull_request.number }} has been merged into staging:\n*<${{ github.event.pull_request.html_url }}|${{ github.event.pull_request.title }}>*"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.prepare-message.outputs.message }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK